name: Android APK
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify DSP on the host
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -Iapp/src/main/cpp tests/dsp_smoke.cpp -o /tmp/noizient-dsp-smoke
          /tmp/noizient-dsp-smoke
      - run: gradle :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: noizient-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
